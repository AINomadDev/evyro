# cargo-deny: checked on every pull request (the `audit` job in CI).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# Known vulnerabilities (RustSec) fail the build. Unmaintained crates are
# reported for direct dependencies only.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Licenses compatible with shipping Evyro under MIT OR Apache-2.0.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "ISC",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
