[workspace]
resolver = "2"
members = ["crates/evyro-core", "crates/evyro-mcp", "crates/evyro-cli", "crates/evyro-desktop"]
# The desktop app needs system webview libraries; plain `cargo build`/`test` skip it.
default-members = ["crates/evyro-core", "crates/evyro-mcp", "crates/evyro-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AINomadDev/evyro"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
sha2 = "0.11"
hmac = "0.13"
uuid = { version = "1", features = ["v4", "v7"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
directories = "6"
regex = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
