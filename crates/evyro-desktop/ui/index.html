<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evyro</title>
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="logo.png" alt="" width="28" height="28">
        <span>Evyro</span>
      </div>
      <div class="side-label" data-i18n="frame.projects">Projects</div>
      <nav id="project-list" class="project-list" aria-label="Projects" data-i18n-aria-label="frame.projects"></nav>
      <button id="add-project-btn" class="btn ghost small side-add" data-i18n="frame.addProject">+ Add project</button>
      <div id="side-threads" class="side-threads"></div>
      <div class="side-foot" id="side-foot"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-wrap">
          <h1 id="project-title">No project selected</h1>
          <div id="project-sub" class="muted small"></div>
        </div>
        <div class="top-actions">
          <span id="live-badge" class="live-badge" aria-live="polite"></span>
          <button id="ctx-btn" class="btn small ghost hidden" aria-controls="ctx" title="Show or hide the shared context" data-i18n-title="frame.ctxToggle"></button>
          <button id="search-btn" class="btn small ghost" title="Search the project" data-i18n-title="frame.searchProject"></button>
          <button id="palette-btn" class="btn small ghost" title="Command palette" data-i18n-title="frame.palette"></button>
        </div>
        <nav class="tabs" id="tabs">
          <button data-view="workspace" class="tab active" data-i18n="tab.workspace">Workspace</button>
          <button data-view="tasks" class="tab" data-i18n="tab.tasks">Tasks</button>
          <button data-view="changes" class="tab" data-i18n="tab.changes">Changes</button>
          <button data-view="history" class="tab" data-i18n="tab.history">History</button>
          <button data-view="knowledge" class="tab" title="Decisions and project memory" data-i18n-title="tab.knowledge.title" data-i18n="tab.knowledge">Knowledge</button>
          <button data-view="skills" class="tab" data-i18n="tab.skills">Skills</button>
          <button data-view="agents" class="tab" data-i18n="tab.agents">AI targets</button>
          <button data-view="settings" class="tab" data-i18n="tab.settings">Settings</button>
        </nav>
      </header>
      <section id="view" class="view"></section>
    </main>

    <aside id="ctx" class="ctx hidden" aria-label="Shared context" aria-hidden="true">
      <div class="ctx-tabs">
        <div role="tablist" aria-label="Inspector" data-i18n-aria-label="frame.ctxInspector" class="row">
          <button class="ctx-tab active" role="tab" data-pane="context" aria-selected="true" aria-controls="ctx-body" data-i18n="frame.ctxTab.context">Context</button>
          <button class="ctx-tab" role="tab" data-pane="changes" aria-selected="false" aria-controls="ctx-body" data-i18n="frame.ctxTab.changes">Changes</button>
        </div>
        <span class="spacer"></span>
        <button id="ctx-close" class="btn ghost small" aria-label="Hide the shared context" data-i18n-aria-label="frame.ctxHide">✕</button>
      </div>
      <div id="ctx-body" class="ctx-body" role="tabpanel"></div>
    </aside>

    <aside id="drawer" class="drawer hidden" aria-hidden="true">
      <div class="drawer-head">
        <div id="drawer-title" class="drawer-title"></div>
        <button id="drawer-close" class="btn ghost small" aria-label="Close" data-i18n-aria-label="frame.close">✕</button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
    </aside>
    <footer id="statusbar" class="statusbar hidden" aria-label="Status"></footer>
  </div>

  <div id="modal-root"></div>
  <div id="palette-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/addon-fit.js"></script>
  <script src="i18n.js"></script>
  <script src="locales/en.js"></script>
  <script src="locales/es.js"></script>
  <script src="locales/pt-BR.js"></script>
  <script src="locales/zh-CN.js"></script>
  <script src="locales/ja.js"></script>
  <script src="locales/hi.js"></script>
  <script src="app.js"></script>
  <script src="appearance.js"></script>
  <script src="threads.js"></script>
  <script src="search.js"></script>
  <script src="skills.js"></script>
  <script src="remote.js"></script>
  <script src="update.js"></script>
  <script src="chat.js"></script>
  <script src="review.js"></script>
  <script src="workspace.js"></script>
  <script src="comparison.js"></script>
</body>
</html>
