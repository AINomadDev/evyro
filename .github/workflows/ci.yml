name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: desktop system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Known vulnerabilities (RustSec), licenses and dependency sources.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: git identity for test repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - run: cargo test --workspace --exclude evyro-desktop

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev
      - run: cargo build -p evyro-desktop
      - run: cargo test -p evyro-desktop

  cli-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p evyro-cli
      - name: CLI end-to-end (no agents)
        shell: bash
        run: bash scripts/cli-e2e.sh
      - name: release scripts (version check, notes, formula, install script)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/release/selftest.sh

  ui-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: git identity for test repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - run: cargo build -p evyro-cli
      - name: playwright
        run: npm install --no-save playwright@1.49.1 axe-core@4.10.2 && npx playwright install chromium
      - run: node crates/evyro-desktop/tests/ui-smoke.cjs
      - name: Phone companion against the real server
        if: runner.os == 'Linux'
        run: node crates/evyro-remote/tests/companion-smoke.cjs

  bundle:
    needs: [lint, audit, test, cli-e2e, ui-smoke]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: "--target universal-apple-darwin", rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
          - { os: ubuntu-22.04, args: "", rust_targets: "" }
          - { os: windows-latest, args: "", rust_targets: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
      # Tauri signs and notarizes the app when these are in the environment.
      # Without the secrets the build is unsigned, as before. See docs/RELEASING.md.
      - name: macOS signing and notarization, when the secrets are set
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/release/apple-env.sh
      # With the update key in secrets, Tauri also writes the signed update
      # files (.app.tar.gz, .sig) that the app's updater downloads.
      # Without it the installers are built as before. See docs/RELEASING.md.
      - name: build installers (.dmg, .exe, .deb, .AppImage)
        working-directory: crates/evyro-desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          extra=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            extra='--config {"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "no TAURI_SIGNING_PRIVATE_KEY secret: building without update files"
          fi
          npx --yes @tauri-apps/cli@2.12.6 build ${{ matrix.args }} $extra
      - name: checksums
        shell: bash
        run: |
          cd target
          find . -path '*/release/bundle/*' -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) > files.txt
          cat files.txt
          while read f; do (shasum -a 256 "$f" 2>/dev/null || sha256sum "$f") >> SHA256SUMS-${{ runner.os }}.txt; done < files.txt
      # Install each installer on this fresh machine and start the app from
      # it: it must still be running after 20 seconds.
      - name: install the .deb and .AppImage and start the app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y xvfb
          deb=$(find target -path '*/release/bundle/deb/*.deb' | head -1)
          pkg=$(dpkg-deb -f "$deb" Package)
          sudo apt-get install -y "./$deb"
          bin=$(dpkg -L "$pkg" | grep -E '^/usr/bin/' | head -1)
          echo "installed $pkg: $bin"
          test -x "$bin"
          set +e
          HOME=$(mktemp -d) timeout 20 xvfb-run -a "$bin"; s=$?
          [ $s -eq 124 ] || { echo "the app from the .deb exited early ($s)"; exit 1; }
          img=$(find target -path '*/release/bundle/appimage/*.AppImage' | head -1)
          chmod +x "$img"
          HOME=$(mktemp -d) APPIMAGE_EXTRACT_AND_RUN=1 timeout 20 xvfb-run -a "$img"; s=$?
          [ $s -eq 124 ] || { echo "the AppImage exited early ($s)"; exit 1; }
          echo "both stayed running"
      - name: install from the .dmg and start the app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(find target -path '*/release/bundle/dmg/*.dmg' | head -1)
          hdiutil attach "$dmg" -mountpoint /Volumes/evyro-check -nobrowse
          cp -R /Volumes/evyro-check/*.app "$RUNNER_TEMP/"
          hdiutil detach /Volumes/evyro-check
          app=$(find "$RUNNER_TEMP" -maxdepth 4 -path '*.app/Contents/MacOS/*' -type f | head -1)
          echo "installed: $app"; lipo -archs "$app"
          if [ "${EVYRO_SIGNED:-}" = 1 ]; then
            bundle="${app%/Contents/MacOS/*}"
            codesign --verify --deep --strict --verbose=2 "$bundle"
            spctl --assess --type execute --verbose=2 "$bundle"
            xcrun stapler validate "$dmg"
            echo "signed, notarized and stapled"
          fi
          HOME=$(mktemp -d) "$app" & pid=$!
          sleep 20
          kill -0 $pid || { echo "the app from the .dmg exited early"; exit 1; }
          kill $pid
          echo "stayed running"
      - name: run the installer silently and start the app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem target -Recurse -Filter *-setup.exe | Where-Object { $_.FullName -match 'bundle\\nsis' } | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Evyro", "$env:ProgramFiles\Evyro" -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $app) { throw "the installed app was not found" }
          Write-Host "installed: $($app.FullName)"
          $p = Start-Process $app.FullName -PassThru
          Start-Sleep 20
          if ($p.HasExited) { throw "the installed app exited early ($($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host "stayed running"
      - name: software bill of materials (Rust and npm dependencies)
        if: runner.os == 'Linux'
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: target/evyro-sbom.spdx.json
          upload-artifact: false
      - name: signed build provenance for the installers
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.AppImage
      - name: signed SBOM attestation for the Linux installers
        if: runner.os == 'Linux'
        uses: actions/attest-sbom@v2
        with:
          subject-path: |
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.AppImage
          sbom-path: target/evyro-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: evyro-desktop-${{ runner.os }}
          path: |
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.app.tar.gz
            target/**/release/bundle/**/*.sig
            target/SHA256SUMS-*.txt
            target/evyro-sbom.spdx.json

  release-build:
    needs: [lint, audit, test]
    # On a manual run everything but the publish step runs, so the pipeline
    # can be tried on a branch without making a release.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: tag, Cargo.toml, tauri.conf.json and CHANGELOG.md agree
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"
          else tag="v$(awk -F'"' '/^\[workspace.package\]/{f=1;next} /^\[/{f=0} f&&/^version *=/{print $2; exit}' Cargo.toml | head -1)"; fi
          echo "EVYRO_VERSION=${tag#v}" >> "$GITHUB_ENV"
          bash scripts/release/check-version.sh "$tag"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p evyro-cli --target ${{ matrix.target }}
      - name: macOS signing and notarization, when the secrets are set
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/release/apple-env.sh
      - name: sign and notarize the CLI
        if: runner.os == 'macOS' && env.EVYRO_SIGNED == '1'
        shell: bash
        run: bash scripts/release/sign-macos-cli.sh target/${{ matrix.target }}/release/evyro
      - name: archive
        shell: bash
        run: |
          name="evyro-$EVYRO_VERSION-${{ matrix.target }}"
          mkdir -p "dist/$name"
          f=evyro; [ -f target/${{ matrix.target }}/release/evyro.exe ] && f=evyro.exe
          cp "target/${{ matrix.target }}/release/$f" README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "dist/$name/"
          cd dist
          if [ "$f" = evyro.exe ]; then 7z a -tzip "$name.zip" "$name" >/dev/null; else tar -czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"
          ls -l
      # The x86_64 macOS build is made on an arm64 runner and is not run here.
      - name: the archived CLI runs
        if: runner.os != 'Windows' && matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          cd "$RUNNER_TEMP" && tar -xzf "$GITHUB_WORKSPACE"/dist/*.tar.gz
          ./evyro-*/evyro --version | grep -F "$EVYRO_VERSION"
      - name: signed build provenance for the CLI
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/evyro-*
      - uses: actions/upload-artifact@v4
        with:
          name: evyro-cli-${{ matrix.target }}
          path: dist/evyro-*

  # Publish a GitHub Release for a version tag: installers, CLI archives, one
  # SHA256SUMS over everything, the SBOM and a Homebrew formula. A tag with a
  # pre-release part (v0.2.0-rc.1) is published as a pre-release.
  publish:
    needs: [bundle, release-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: collect release files
        shell: bash
        run: |
          mkdir dist
          find artifacts -type f \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' \
            -o -name 'evyro-*.tar.gz' -o -name 'evyro-*.zip' -o -name 'evyro-sbom.spdx.json' \) -exec cp {} dist/ \;
          # Update files, when the build was signed with the update key: the
          # macOS app archive gets the version in its name, and latest.json
          # tells installed apps where the new version is.
          app=$(find artifacts -type f -name '*.app.tar.gz' | head -1)
          if [ -n "$app" ]; then
            v="${GITHUB_REF_NAME#v}"
            cp "$app" "dist/Evyro_${v}_universal.app.tar.gz"
            cp "$app.sig" "dist/Evyro_${v}_universal.app.tar.gz.sig"
            find artifacts -type f \( -name '*-setup.exe.sig' -o -name '*.AppImage.sig' \) -exec cp {} dist/ \;
            bash scripts/release/latest-json.sh "$v" dist "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" > dist/latest.json
            cat dist/latest.json
          fi
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Homebrew formula
        run: bash scripts/release/homebrew.sh "${GITHUB_REF_NAME#v}" dist/SHA256SUMS > dist/evyro.rb
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          bash scripts/release/notes.sh "$v" > notes.md
          cat >> notes.md <<'EOF'

          ### Install

          - **macOS:** open the `.dmg` and drag Evyro to Applications. While builds are unsigned, macOS blocks the first open: click **Open Anyway** in System Settings › Privacy & Security, or run `xattr -dr com.apple.quarantine /Applications/Evyro.app`.
          - **Windows:** run the `-setup.exe`.
          - **Linux:** install the `.deb`, or make the `.AppImage` executable and run it.
          - **CLI only:** `curl -fsSL https://raw.githubusercontent.com/AINomadDev/evyro/main/scripts/install.sh | sh`, or on Windows `irm https://raw.githubusercontent.com/AINomadDev/evyro/main/scripts/install.ps1 | iex`.

          Check a download with `sha256sum -c SHA256SUMS --ignore-missing`, or its build provenance with `gh attestation verify <file> --repo AINomadDev/evyro`.
          EOF
          pre=""; case "$v" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Evyro $v" --notes-file notes.md $pre
      - name: update the Homebrew tap, when its token is set
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "no HOMEBREW_TAP_TOKEN secret: formula attached to the release only"; exit 0; fi
          case "$GITHUB_REF_NAME" in *-*) echo "pre-release: tap left alone"; exit 0 ;; esac
          git clone "https://x-access-token:$TAP_TOKEN@github.com/AINomadDev/homebrew-tap.git" tap
          mkdir -p tap/Formula && cp dist/evyro.rb tap/Formula/evyro.rb
          cd tap
          git config user.name "Evyro release"; git config user.email "release@users.noreply.github.com"
          git add Formula/evyro.rb
          git commit -m "evyro ${GITHUB_REF_NAME#v}" && git push
